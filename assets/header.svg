<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Dex. Founder of MintHost and MintBreeze.">
  <title>Dex. Founder of MintHost and MintBreeze.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f5faff"/>
      <stop offset="1" stop-color="#d9ecfa"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#4aa3df" opacity=".22"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .h { font: 800 112px 'Syne', 'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f4e79; letter-spacing: -6px; }
      .s { font: 600 24px 'DM Sans', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #3b6f9c; }
      .m { font: 500 15px 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .wave { animation: drift 9s ease-in-out infinite alternate; }
      .wave2 { animation: drift 12s ease-in-out infinite alternate-reverse; }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-60px); } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .wave, .wave2, .caret { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#dots)"/>
  <rect width="1200" height="300" rx="22" fill="url(#fade)"/>

  <!-- mountains + wind, the MintBreeze mark scaled up -->
  <g opacity=".9">
    <path d="M700 300 L880 92 L955 178 L1030 104 L1200 270 L1200 300 Z" fill="#cfe6f8"/>
    <path d="M700 300 L880 92 L955 178 L1030 104 L1200 270" fill="none" stroke="#4aa3df" stroke-width="6" stroke-linejoin="round"/>
    <path d="M846 132 L880 92 L912 130" fill="none" stroke="#1f4e79" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <g class="wave">
    <path d="M640 252 C 720 222, 800 222, 880 250 S 1040 280, 1120 246 S 1240 222, 1300 240" fill="none" stroke="#1f4e79" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g class="wave2" opacity=".6">
    <path d="M660 276 C 740 256, 820 258, 900 274 S 1060 292, 1140 270 S 1260 256, 1320 266" fill="none" stroke="#4aa3df" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- small logo chip -->
  <g transform="translate(60 44)">
    <rect width="40" height="40" rx="10" fill="#fff" stroke="#cfe3f3"/>
    <g transform="translate(4 4) scale(.5)">
      <path d="M8 40 L24 20 L31 29 L38 21 L56 40" fill="none" stroke="#4aa3df" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M8 49 C 16 43, 24 43, 32 48 S 48 53, 56 46" fill="none" stroke="#1f4e79" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <text x="56" y="26" class="m" fill="#4aa3df" letter-spacing="3">FOUNDER · MINTHOST &amp; MINTBREEZE</text>
  </g>

  <text x="54" y="186" class="h">Dex<tspan fill="#4aa3df">.</tspan></text>
  <text x="62" y="232" class="s">Software that picks up the phone and books the client.</text>

  <!-- code chip -->
  <g transform="translate(62 252)">
    <text class="m" y="18"><tspan fill="#1f4e79">const</tspan><tspan fill="#33536f"> dex = </tspan><tspan fill="#2f86c4">ship</tspan><tspan fill="#7d97ae">(</tspan><tspan fill="#1b8a7a">"small, then listen"</tspan><tspan fill="#7d97ae">);</tspan></text>
    <rect class="caret" x="346" y="4" width="2.5" height="18" fill="#4aa3df"/>
  </g>
</svg>
